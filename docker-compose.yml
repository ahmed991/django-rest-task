services:
  db_service:
    image: postgis/postgis:16-master
    container_name: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - DB_HOST = ${DB_HOST}
      - MAX_CLIENT_CONN=200
    ports:
      - "${DB_PORT}:5432"

volumes:
  postgres_data: